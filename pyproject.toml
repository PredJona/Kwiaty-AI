[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kwiaty"
version = "0.1.0"
description = "Asistente local-first modular para CachyOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
kwiaty = "kwiaty.cli.main:main"

[tool.setuptools.packages.find]
include = ["kwiaty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
